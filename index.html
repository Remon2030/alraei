function registerVisitGroup(persons,visitInfo){
 const changes=[];const groupVisitId=persons.length>1?uid():null;
 for(const p of persons){
  // Prevent duplicate one-tap household/individual home visits for the same day.
  if((p.visits||[]).some(v=>v.date===visitInfo.date&&v.type===visitInfo.type&&v.result===visitInfo.result))continue;
  const next=addVisit(p,{...visitInfo,groupVisitId},data.settings);
  const newEntry=next.visits.find(v=>!(p.visits||[]).some(x=>x.id===v.id));
  if(newEntry){changes.push({personId:p.id,entryId:newEntry.id,previousFollowupDue:p.followupDue??null});replaceP(next)}
 }
 return changes;
}

function ensurePlanningSchema(){
 if(!data)return;
 if(!Array.isArray(data.appointments))data.appointments=[];
 if(!Array.isArray(data.taskRules))data.taskRules=[];
 if(!Array.isArray(data.taskExceptions))data.taskExceptions=[];
}
function plusMonths(date,months){const d=parseDate(date);if(!d)return '';const original=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+months);d.setDate(Math.min(original,new Date(d.getFullYear(),d.getMonth()+1,0).getDate()));return today(d)}
function timeMinutes(t){if(!/^\d{2}:\d{2}$/.test(t||''))return NaN;const [h,m]=t.split(':').map(Number);return h>=0&&h<24&&m>=0&&m<60?h*60+m:NaN}
function validHours(start,end){return Number.isFinite(timeMinutes(start))&&Number.isFinite(timeMinutes(end))&&timeMinutes(start)<timeMinutes(end)}
function itemLabel(ev){if(ev.kind==='confession')return 'موعد اعتراف · '+(findP(ev.personId)?.name||ev.title||'شخص محذوف');if(ev.kind==='visit')return 'موعد افتقاد · '+(findP(ev.personId)?.name||ev.title||'شخص محذوف');if(ev.kind==='family-visit')return 'افتقاد أسرة · '+(data.families.find(f=>f.id===ev.familyId)?familyTitle(data.families.find(f=>f.id===ev.familyId)):(ev.title||'أسرة غير موجودة'));return ev.title||'مهمة';}
function spanEvents(from,to){ensurePlanningSchema();const arr=[];if(!parseDate(from)||!parseDate(to)||from>to)return arr;
 for(const a0 of data.appointments){if(a0.date>=from&&a0.date<=to&&a0.status!=='cancelled')arr.push({...a0,instanceKey:a0.id,recurring:false});}
 for(const r of data.taskRules){if(!parseDate(r.startDate)||!parseDate(r.endDate)||r.endDate<from||r.startDate>to)continue;
  let cur=r.startDate>from?r.startDate:from,last=r.endDate<to?r.endDate:to;let nd=daysBetween(cur,last);
  for(let n=0;n<=nd&&n<380;n++){const date=addDays(cur,n);if(!(r.days||[]).includes(parseDate(date).getDay()))continue;
   const override=data.taskExceptions.find(x=>x.ruleId===r.id&&x.date===date);if(override?.cancelled)continue;
   arr.push({id:r.id,ruleId:r.id,date,kind:r.kind||'task',title:override?.title??r.title,start:override?.start??r.start,end:override?.end??r.end,note:override?.note??r.note,remindMinutes:override?.remindMinutes??r.remindMinutes,status:'planned',recurring:true,instanceKey:r.id+'@'+date});
  }
 }
 return arr.sort((a,b)=>a.date.localeCompare(b.date)||a.start.localeCompare(b.start)||itemLabel(a).localeCompare(itemLabel(b),'ar'));
}
function overlapsFor(date,start,end,skipKey=''){if(!validHours(start,end))return [];return spanEvents(date,date).filter(x=>x.instanceKey!==skipKey&&start<x.end&&end>x.start);}
function timeStr(t){const [h,m]=(t||'00:00').split(':');return h+':'+m}
function calendarLabel(date){const d=parseDate(date);return d?WEEKDAYS[d.getDay()]+' '+shortDate(date):shortDate(date)}

function eventBlock(ev,showDay=false){const cl=overlapsFor(ev.date,ev.start,ev.end,ev.instanceKey),planned=ev.status==='planned',canDone=!ev.recurring&&planned&&ev.date<=today();const label=itemLabel(ev);
 const actions=ev.recurring?`${button('تعديل اليوم فقط','edit-occurrence','btn small outline',`data-id="${a(ev.ruleId)}" data-date="${a(ev.date)}"`)}${button('تعديل التكرار','edit-rule','btn small secondary',`data-id="${a(ev.ruleId)}"`)}`:

 return `<div class="event-item ${cl.length?'conflict':''}"><div class="event-top"><div class="event-time">${showDay?`<div>${e(calendarLabel(ev.date))}</div>`:''}<div>${e(timeStr(ev.start))} – ${e(timeStr(ev.end))}</div></div><div class="event-desc"><b>${e(label)}${ev.recurring?' ↻':''}</b><small>${ev.note?e(ev.note)+' · ':''}${ev.recurring?'مهمة متكررة':ev.status==='done'?'تم التنفيذ':'موعد محدد'}</small>${cl.length?`<div class="conflict-warning">⚠ تعارض مع ${e(cl.slice(0,3).map(itemLabel).join('، '))}</div>`:''}${inAppDue(ev)?'<span class="tag due">موعد قريب الآن</span>':''}</div></div><div class="event-actions">${actions}</div></div>`}

// Coptic date calculated locally for Gregorian 1900–2099; daily liturgical readings are linked to reviewed sources.
const COPTIC_MONTHS=['توت','بابه','هاتور','كيهك','طوبه','أمشير','برمهات','برموده','بشنس','بؤونه','أبيب','مسرى','النسيء'];
function copticNewYear(y){return String(y)+'-09-'+(y%4===3?'12':'11')}
function copticDate(s){const d=parseDate(s);if(!d)return null;const y=d.getFullYear();if(y<1900||y>2099)return null;const ny=copticNewYear(y),start=s>=ny?ny:copticNewYear(y-1),age=(s>=ny?y:y-1)-283;const dist=daysBetween(start,s);const m=Math.floor(dist/30),day=dist%30+1;return {year:age,month:m+1,day,monthName:COPTIC_MONTHS[m]||'غير معروف'};}
function copticFixedDate(copticYear,month,day){const y=copticYear+283;return addDays(copticNewYear(y),(month-1)*30+day-1)}
function orthodoxEaster(y){const a=y%4,b=y%7,c=y%19,d=(19*c+15)%30,e=(2*a+4*b-d+34)%7;const month=Math.floor((d+e+114)/31),day=(d+e+114)%31+1;const dt=new Date(Date.UTC(y,month-1,day+13,12));return dt.toISOString().slice(0,10)}
function localOccasionsForYear(y){const eas=orthodoxEaster(y);const out=[
 [addDays(eas,-69),'صوم يونان','fast',addDays(eas,-67)],
 [addDays(eas,-55),'بداية الصوم الكبير','fast',addDays(eas,-1)],
 [addDays(eas,-7),'أحد الشعانين','feast'],
 [addDays(eas,-6),'بداية أسبوع الآلام','fast',addDays(eas,-1)],
 [addDays(eas,-3),'خميس العهد','feast'],
 [addDays(eas,-2),'الجمعة العظيمة','fast'],
 [eas,'عيد القيامة المجيد','feast'],
 [addDays(eas,39),'عيد الصعود','feast'],
 [addDays(eas,49),'عيد العنصرة','feast'],
 [addDays(eas,50),'بداية صوم الرسل','fast'],
 ];for(const cy of [y-284,y-283,y-282]){
  for(const [m,d,title,kind,end] of [[4,29,'عيد الميلاد المجيد','feast'],[5,11,'عيد الغطاس','feast'],[1,1,'عيد النيروز','feast'],[1,17,'عيد الصليب','feast'],[12,5,'عيد الرسل','feast'],[12,1,'بداية صوم العذراء','fast',15],[12,16,'عيد صعود جسد السيدة العذراء','feast'],[3,16,'بداية صوم الميلاد','fast']]){
   const date=copticFixedDate(cy,m,d);if(date.slice(0,4)==String(y))out.push([date,title,kind,typeof end==='number'?copticFixedDate(cy,m,end):undefined]);
  }
 }
 return out.map(([date,title,kind,ends])=>({date,title,kind,ends})).filter(x=>x.date.slice(0,4)==String(y)).sort((a,b)=>a.date.localeCompare(b.date));}
function upcomingOccasions(from=today(),days=180){const y=Number(from.slice(0,4));return [y-1,y,y+1].flatMap(localOccasionsForYear).filter(x=>x.date>=from&&daysBetween(from,x.date)<=days).sort((a,b)=>a.date.localeCompare(b.date));}
